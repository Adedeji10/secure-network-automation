---
# roles/cisco_ios_router/tasks/main.yml
- name: Apply router configuration
  ansible.builtin.copy:
    src: "{{ config_file }}"
    dest: "/etc/frr/frr.conf"
    mode: '0644'
  when: config_file is defined

- name: Verify hostname is set
  ansible.builtin.command:
    cmd: hostname
  register: hostname_output
  changed_when: false

- name: Display hostname
  ansible.builtin.debug:
    msg: "Router hostname: {{ hostname_output.stdout }}"
