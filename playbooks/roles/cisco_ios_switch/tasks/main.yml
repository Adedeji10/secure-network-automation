---
# roles/cisco_ios_switch/tasks/main.yml
- name: Apply switch configuration
  ansible.builtin.copy:
    src: "{{ config_file }}"
    dest: "/etc/frr/frr.conf"
    mode: '0644'
  when: config_file is defined

- name: Verify switch is reachable
  ansible.builtin.command:
    cmd: hostname
  register: hostname_output
  changed_when: false

- name: Display hostname
  ansible.builtin.debug:
    msg: "Switch hostname: {{ hostname_output.stdout }}"
