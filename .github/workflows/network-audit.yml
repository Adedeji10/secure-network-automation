name: Secure Network Automation - Inspector Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'configs/**'
      - 'inspector/**'
      - 'rules/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'configs/**'
      - 'inspector/**'
      - 'rules/**'

jobs:
  # ─────────────────────────────────────────
  # JOB 1: SECURITY AUDIT (Inspector)
  # Runs on every push/PR - blocks if violations found
  # ─────────────────────────────────────────
  audit:
    name: Inspector Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Inspector dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Identify modified configuration files
        id: changed-files
        run: |
          echo "Checking for modified config files..."
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'configs/**' 2>/dev/null ||                     git diff --name-only HEAD -- 'configs/**' 2>/dev/null ||                     find configs/ -name '*.txt' | head -5)
          echo "Changed files: $CHANGED"
          echo "changed=$CHANGED" >> $GITHUB_OUTPUT

      - name: Run Inspector on all configuration files
        id: inspector
        run: |
          cd inspector
          echo "============================================"
          echo "  INSPECTOR - SECURITY AUDIT STARTING"
          echo "============================================"
          python3 audit.py ../configs/
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          exit $EXIT_CODE

      - name: Upload audit report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inspector-audit-report
          path: |
            inspector/*.json
          retention-days: 30

      - name: Post audit summary to PR
        if: always() && github.event_name == 'pull_request'
        run: |
          cd inspector
          echo "## Inspector Audit Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          python3 audit.py ../configs/ >> $GITHUB_STEP_SUMMARY 2>&1 || true

  # ─────────────────────────────────────────
  # JOB 2: ANSIBLE DEPLOYMENT
  # Only runs if audit job passes
  # ─────────────────────────────────────────
  deploy:
    name: Ansible Configuration Deployment
    runs-on: ubuntu-latest
    needs: audit
    if: success() && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Ansible
        run: |
          pip install ansible
          ansible --version

      - name: Verify deployment readiness
        run: |
          echo "============================================"
          echo "  DEPLOYMENT GATE - AUDIT PASSED"
          echo "  All configuration files are compliant"
          echo "  Ansible deployment authorized"
          echo "============================================"
          ls -la configs/routers/
          ls -la configs/switches/
          ls -la configs/firewalls/

      - name: Deploy configurations via Ansible
        run: |
          echo "Ansible deployment step"
          echo "In production: ansible-playbook playbooks/site.yml -i inventory.ini"
          echo "Deployment simulated successfully - configs are compliant"
          echo "DEPLOYMENT STATUS: SUCCESS"
